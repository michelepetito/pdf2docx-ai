[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2docx-ai-fidelity"
version = "0.2.0"
description = "Local PDF to editable Word conversion with geometry, OCR and measured quality"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
  "PyMuPDF>=1.26.7,<1.27", "python-docx>=1.2,<2", "lxml>=5,<7",
  "Pillow>=11,<14", "numpy>=2,<3", "pydantic>=2.10,<3",
  "typer>=0.16,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "psutil>=6,<8"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
opencv = ["opencv-python-headless>=4.11,<5"]

[project.scripts]
pdf2docx-ai = "pdf2docx_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf2docx_ai = ["web/templates/*.html", "web/static/*", "ocr/*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["real_ocr: requires a real local OCR backend", "renderer: requires LibreOffice", "complex: opt-in complex corpus regression"]
