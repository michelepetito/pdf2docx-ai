name: Cross-platform checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install the documented Linux metric fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-liberation
          fc-match -f '%{family}\n' 'Times New Roman'
          fc-match -f '%{family}\n' 'Courier New'
      - name: Install shared application versions
        run: python -m pip install -c constraints.txt -e ".[test]"
      - name: Check dependencies
        run: python -m pip check
      - name: Run portable tests without external OCR models
        run: python -m pytest -m "not real_ocr and not complex and not renderer" -q --junitxml=ci-results.xml
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: ci-results.xml

  linux-render-ocr:
    name: Linux · LibreOffice and Tesseract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng fonts-liberation fontconfig
      - run: python -m pip install -c constraints.txt -e ".[test]"
      - run: python tests/fixtures/generate.py tests/fixtures/generated
      - name: Convert native PDF with edit validation
        run: pdf2docx-ai convert tests/fixtures/generated/native.pdf --output examples/output/ci-native.docx --validate-editability --json
      - name: Convert Italian scan with real Tesseract
        run: pdf2docx-ai convert tests/fixtures/generated/scan_it.pdf --engine tesseract --language it --output examples/output/ci-scan.docx --ground-truth tests/fixtures/generated/scan_it.txt --validate-visual --json
      - name: Verify renderer and OCR evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          native=json.loads(Path('examples/output/ci-native.quality.json').read_text())
          scan=json.loads(Path('examples/output/ci-scan.quality.json').read_text())
          assert native['visual']['status']=='measured'
          assert native['assessment']['dimensions']['structure']['edit_probe']['status']=='measured'
          assert scan['engine']=='tesseract'
          assert scan['visual']['status']=='measured'
          assert scan['assessment']['dimensions']['textual']['primary']['cer'] is not None
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: linux-render-ocr-reports
          path: |
            examples/output/*.quality.json
            examples/output/*.quality.html
            examples/output/*.docx
